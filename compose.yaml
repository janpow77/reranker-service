# reranker-service — generisches Compose-File, deploybar auf NUC/evo/Desktop.
#
# Bind-Mount /var/lib/reranker/data persistiert den HF-Cache; das vermeidet,
# dass beim ersten Container-Start das Modell aus dem Image kopiert werden
# muss. Erster Lauf kopiert aus /opt/hf_cache_baked.
#
# GPU-Setup: docker-compose.gpu.yaml mergt die runtime: nvidia + deploy.resources
# (siehe compose.gpu.yaml). CPU-only ist Default.

services:
  reranker-service:
    image: ghcr.io/janpow77/reranker-service:${IMAGE_TAG:-latest}
    container_name: reranker-service
    restart: unless-stopped
    environment:
      RERANKER_PORT: "8004"
      RERANKER_DEVICE: "${RERANKER_DEVICE:-cpu}"
      RERANKER_DEFAULT_MODEL: "${RERANKER_DEFAULT_MODEL:-BAAI/bge-reranker-v2-m3}"
      RERANKER_PRELOAD_MODELS: "${RERANKER_PRELOAD_MODELS:-BAAI/bge-reranker-v2-m3}"
      RERANKER_EAGER_LOAD: "true"
      RERANKER_MAX_PASSAGES: "200"
      RERANKER_MAX_SEQ_LEN: "512"
      HF_HOME: "/data/hf_cache"
      HF_HUB_DISABLE_TELEMETRY: "1"
      # API-Key: leer = offen (nur Tailscale). Empfohlen: vom llm-router
      # gesetzt + im llm-router-Spoke-Header gesendet.
      RERANKER_API_KEY: "${RERANKER_API_KEY:-}"
    volumes:
      - /var/lib/reranker/data:/data
    # Default: nur Tailscale-erreichbar — bind auf 100.x.y.z, nicht 0.0.0.0.
    # Beim NUC-Setup wird Tailscale-IP automatisch ueber Compose-Override gesetzt.
    ports:
      - "${RERANKER_BIND:-0.0.0.0}:8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8004/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 4g
    cpus: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
