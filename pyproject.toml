[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reranker-service"
version = "0.1.0"
description = "Cross-Encoder Reranker-Microservice. Host-agnostisch (NUC/evo-x2/Desktop), wird vom llm-router als Spoke (capability=rerank) angesprochen."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sentence-transformers>=2.7",
    # torch wird ueber sentence-transformers gezogen; CPU-only Variante im
    # Dockerfile via --index-url https://download.pytorch.org/whl/cpu.
    # Fuer GPU-Builds: requirements-gpu.txt verwenden.
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
